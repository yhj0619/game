<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동물의숲 스피드 타이핑</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="feverBanner" aria-hidden="true">FEVER!</div>

  <main id="modeScreen" class="mode-screen">
    <section class="mode-hero" aria-labelledby="mainTitle">
      <div class="hero-sky" aria-hidden="true">
        <span class="hero-cloud cloud-one"></span>
        <span class="hero-cloud cloud-two"></span>
      </div>
      <div class="hero-title-board">
        <span class="hero-leaf" aria-hidden="true"></span>
        <p>동물의 숲</p>
        <h1 id="mainTitle">스피드 타이핑</h1>
      </div>
      <div id="modeCharacters" class="mode-characters" aria-label="함께 플레이할 캐릭터"></div>
    </section>

    <div class="mode-menu">
      <p class="mode-question">어떤 방식으로 연습할까?</p>
      <div class="mode-choice-list" aria-label="게임 모드 선택">
        <button class="mode-choice" type="button" data-mode="char">
          <span class="choice-icon" aria-hidden="true">A</span>
          <span class="choice-copy"><strong>한 글자</strong><small>글자를 하나씩 빠르게 입력해요</small></span>
          <span class="choice-arrow" aria-hidden="true">›</span>
        </button>
        <button class="mode-choice" type="button" data-mode="word">
          <span class="choice-icon word-icon" aria-hidden="true">ABC</span>
          <span class="choice-copy"><strong>단어</strong><small>단어를 완성하고 Enter!</small></span>
          <span class="choice-arrow" aria-hidden="true">›</span>
        </button>
      </div>
      <p class="mode-tip">캐릭터와 함께 즐겁게 타이핑해 봐!</p>
    </div>
  </main>

  <main id="gameScreen" class="game-card" hidden>
    <div class="card-header">
      <button id="characterButton" class="character-switch" type="button" aria-haspopup="dialog">
        <span class="switch-coin" aria-hidden="true"></span>
        캐릭터 바꾸기
        <span class="switch-chevron" aria-hidden="true">▾</span>
      </button>
    </div>

    <h1 class="title"><span class="title-motif" aria-hidden="true"></span><span id="titleName">너굴</span> 스피드 타이핑</h1>
    <p id="guide" class="guide">화면의 문자와 똑같이 입력해 줘! 대소문자를 구분한다구.</p>

    <section class="nook-stage">
      <div class="nook-frame">
        <div class="nook-media" id="nookMedia"></div>
        <span class="nook-ring" id="nookRing" aria-hidden="true"></span>
      </div>
      <div class="bubble" aria-live="polite">
        <p id="feedback" class="neutral">시작 버튼을 눌러 줘!</p>
      </div>
    </section>

    <section class="status-bar">
      <div class="status-box">
        <span class="label">벨</span>
        <strong id="score">0벨</strong>
      </div>
      <div class="status-box">
        <span class="label">남은 시간</span>
        <strong id="timer">20초</strong>
      </div>
    </section>

    <section class="combo-bar">
      <span class="label">콤보</span>
      <div class="stamps" id="stamps" aria-hidden="true">
        <span class="stamp"></span>
        <span class="stamp"></span>
        <span class="stamp"></span>
        <span class="stamp"></span>
        <span class="stamp"></span>
      </div>
      <span id="multiplier" class="multiplier">×1</span>
    </section>

    <section class="target-area" id="targetArea">
      <span id="targetCaption" class="target-caption">이 글자를 입력!</span>
      <span id="targetChar">?</span>
    </section>

    <section class="input-panel">
      <span id="inputLabel" class="label">내가 누른 키</span>
      <span id="typedChar" class="neutral">-</span>
    </section>

    <div class="buttons">
      <button id="startButton" type="button">게임 시작</button>
      <button id="resetButton" type="button">다시 하기</button>
      <button id="changeModeButton" type="button">모드 변경</button>
    </div>
  </main>

  <div id="characterModal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">캐릭터 선택</h2>
      <p class="modal-guide">함께 타이핑할 친구를 골라 줘!</p>
      <div class="character-list" id="characterList"></div>
      <button class="modal-close" type="button" data-close>닫기</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
