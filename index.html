<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>너굴 스피드 타이핑</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="feverBanner" aria-hidden="true">FEVER!</div>

  <main class="game-card">
    <h1 class="title">🍃 너굴 스피드 타이핑</h1>
    <p class="guide">화면의 문자와 똑같이 입력해 줘! 대소문자를 구분한다구.</p>

    <section class="nook-stage">
      <div class="nook-frame">
        <video id="nook" class="idle"
               src="해당_너구리_캐릭터가_손을_흔들며_눈을_깜빡_거리는_실.mp4"
               autoplay loop muted playsinline></video>
        <span class="nook-ring" id="nookRing" aria-hidden="true"></span>
      </div>
      <div class="bubble" aria-live="polite">
        <p id="feedback" class="neutral">시작 버튼을 눌러 줘!</p>
      </div>
    </section>

    <section class="status-bar">
      <div class="status-box">
        <span class="label">벨</span>
        <strong id="score">0벨</strong>
      </div>
      <div class="status-box">
        <span class="label">남은 시간</span>
        <strong id="timer">20초</strong>
      </div>
    </section>

    <section class="combo-bar">
      <span class="label">콤보</span>
      <div class="stamps" id="stamps" aria-hidden="true">
        <span class="stamp">🍃</span>
        <span class="stamp">🍃</span>
        <span class="stamp">🍃</span>
        <span class="stamp">🍃</span>
        <span class="stamp">🍃</span>
      </div>
      <span id="multiplier" class="multiplier">×1</span>
    </section>

    <section class="target-area" id="targetArea">
      <span class="target-caption">이 글자를 입력!</span>
      <span id="targetChar">?</span>
    </section>

    <section class="input-panel">
      <span class="label">내가 누른 키</span>
      <span id="typedChar" class="neutral">-</span>
    </section>

    <div class="buttons">
      <button id="startButton" type="button">게임 시작</button>
      <button id="resetButton" type="button">다시 하기</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
